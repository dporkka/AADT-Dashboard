name: Traffic Forecast API

on:
  pull_request:
    paths:
      - "api/**"
      - "marketplace/**"
      - "Dockerfile.api"
      - ".github/workflows/traffic-forecast-api.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - "marketplace/**"
      - "Dockerfile.api"
      - ".github/workflows/traffic-forecast-api.yml"

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Compile API modules
        run: python -m py_compile api/forecast.py api/main.py
      - name: Run focused tests
        env:
          RAPIDAPI_PROXY_SECRET: test-marketplace-secret
        run: pytest -q api/tests
      - name: Build isolated API image
        run: docker build -f Dockerfile.api -t traffic-forecast-api:test .
