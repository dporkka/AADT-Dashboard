openapi: 3.1.0
info:
  title: Traffic Forecast & Corridor Scenario API
  version: 1.0.0
  description: >-
    Project caller-supplied AADT values into future-year traffic scenarios and optional
    K/D/T-derived planning signals. This API does not redistribute source DOT datasets.
    Returned projections are calculated scenarios, not official agency forecasts.
paths:
  /v1/forecast:
    post:
      operationId: forecastTraffic
      summary: Forecast one traffic scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioInput'
            examples:
              default:
                value:
                  external_id: site-123
                  current_year: 2025
                  current_aadt: 24000
                  reference_year: 2045
                  reference_aadt: 36000
                  target_years: [2030, 2035, 2045]
                  k_factor_percent: 9
                  d_factor_percent: 55
                  t_factor_percent: 8
      responses:
        '200':
          description: Calculated scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '403': {description: Request did not arrive through the configured marketplace gateway}
        '422': {description: Invalid scenario inputs}
        '503': {description: Marketplace origin is not configured}
  /v1/batch:
    post:
      operationId: batchForecastTraffic
      summary: Forecast up to 200 scenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarios]
              additionalProperties: false
              properties:
                scenarios:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: {$ref: '#/components/schemas/ScenarioInput'}
      responses:
        '200': {description: Batch calculated successfully}
        '403': {description: Request did not arrive through the configured marketplace gateway}
        '422': {description: Invalid scenario inputs}
        '503': {description: Marketplace origin is not configured}
  /v1/corridor:
    post:
      operationId: analyzeCorridor
      summary: Forecast and summarize caller-supplied corridor segments
      description: >-
        Projects each segment independently and reports ranges and means. Adjacent-segment
        AADT is intentionally not summed into a corridor traffic total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorridorRequest'
      responses:
        '200': {description: Corridor scenario calculated successfully}
        '403': {description: Request did not arrive through the configured marketplace gateway}
        '422': {description: Invalid corridor inputs}
        '503': {description: Marketplace origin is not configured}
  /v1/health:
    get:
      operationId: marketplaceHealth
      summary: Marketplace service health
      responses:
        '200': {description: Service is healthy}
        '403': {description: Request did not arrive through the configured marketplace gateway}
        '503': {description: Marketplace origin is not configured}
components:
  schemas:
    TrafficInputs:
      type: object
      required: [current_year, current_aadt, reference_year, reference_aadt]
      properties:
        external_id: {type: [string, 'null'], maxLength: 128}
        current_year: {type: integer, minimum: 1900, maximum: 2200}
        current_aadt: {type: number, exclusiveMinimum: 0, maximum: 100000000}
        reference_year: {type: integer, minimum: 1901, maximum: 2300}
        reference_aadt: {type: number, exclusiveMinimum: 0, maximum: 100000000}
        k_factor_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
        d_factor_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
        t_factor_percent: {type: [number, 'null'], minimum: 0, maximum: 100}
    ScenarioInput:
      allOf:
        - $ref: '#/components/schemas/TrafficInputs'
        - type: object
          required: [target_years]
          properties:
            target_years:
              type: array
              minItems: 1
              maxItems: 50
              items: {type: integer}
    ForecastPoint:
      type: object
      required: [target_year, projected_aadt, projected_aadt_rounded]
      properties:
        target_year: {type: integer}
        projected_aadt: {type: number}
        projected_aadt_rounded: {type: integer}
        design_hour_volume: {type: [number, 'null']}
        directional_design_hour_volume: {type: [number, 'null']}
        truck_aadt: {type: [number, 'null']}
    ScenarioResult:
      type: object
      required: [annual_growth_rate, annual_growth_rate_percent, forecasts, methodology]
      properties:
        external_id: {type: [string, 'null']}
        annual_growth_rate: {type: number}
        annual_growth_rate_percent: {type: number}
        forecasts:
          type: array
          items: {$ref: '#/components/schemas/ForecastPoint'}
        methodology: {type: string}
    ForecastResponse:
      type: object
      required: [success, result, calculated_at]
      properties:
        success: {type: boolean, const: true}
        result: {$ref: '#/components/schemas/ScenarioResult'}
        calculated_at: {type: string, format: date-time}
    CorridorSegment:
      allOf:
        - $ref: '#/components/schemas/TrafficInputs'
        - type: object
          required: [segment_id]
          properties:
            segment_id: {type: string, minLength: 1, maxLength: 128}
            route: {type: [string, 'null'], maxLength: 128}
            bmp: {type: [number, 'null']}
            emp: {type: [number, 'null']}
    CorridorRequest:
      type: object
      required: [target_year, segments]
      properties:
        target_year: {type: integer, minimum: 1900, maximum: 2300}
        segments:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/CorridorSegment'}
